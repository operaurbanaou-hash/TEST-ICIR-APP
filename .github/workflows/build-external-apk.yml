name: Build Minha ICIR External APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild Android source archive
        run: |
          cat source-parts/part-*.b64 | base64 -d > ICIR-APP-SOURCE-FULL.zip
          unzip -q ICIR-APP-SOURCE-FULL.zip -d .

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build installable APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/MinhaICIR-External-v1.0.1.apk
          sha256sum dist/MinhaICIR-External-v1.0.1.apk > dist/MinhaICIR-External-v1.0.1.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MinhaICIR-External-v1.0.1
          path: dist/*
          if-no-files-found: error
          retention-days: 30
